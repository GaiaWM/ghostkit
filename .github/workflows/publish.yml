name: publish
# Publishes to PyPI on a version tag (v0.2.0, …) via Trusted Publishing:
# on pypi.org add a "trusted publisher" for project `ghostkit` →
# owner gaiawm, repo ghostkit, workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
